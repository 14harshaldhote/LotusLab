[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lotuslab"
version = "0.1.0"
description = "Weather-driven natural lotus pond simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["lotuslab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
